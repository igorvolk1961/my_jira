services:
  upo:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-jira:latest
    container_name: upo
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Секретный ключ подписи сессии. Задайте свой через .env или окружение:
      #   UPO_SECRET_KEY=<случайная строка> docker compose up -d
      UPO_SECRET_KEY: "${UPO_SECRET_KEY:-change-me-in-prod}"
    volumes:
      # Данные (SQLite-БД + бэкапы) храним на хосте, чтобы не терять при пересоздании
      - ./data:/app/data
