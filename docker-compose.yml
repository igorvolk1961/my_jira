services:
  upo:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-jira:latest
    container_name: upo
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Секретный ключ подписи сессии. Обязателен: задайте свой через .env или окружение:
      #   UPO_SECRET_KEY=<случайная строка> docker compose up -d
      # Без него запуск завершится ошибкой, чтобы не работать со слабым/известным ключом.
      UPO_SECRET_KEY: "${UPO_SECRET_KEY:?UPO_SECRET_KEY is required}"
    volumes:
      # Данные (SQLite-БД + бэкапы) храним на хосте, чтобы не терять при пересоздании
      - ./data:/app/data
