[project]
name = "my-jira"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "gunicorn>=21.2.0",
    "markdown-it-py>=4.2.0",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
